<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Policy Studio | Professional App Legal Generator</title>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  
  <style>
    :root {
      color-scheme: dark;
      --page: #111719; --panel: #1a2225; --panel-raised: #202a2e;
      --panel-soft: #182124; --text: #f1f6f5; --text-soft: #a7b6b5;
      --muted: #7c8d8c; --line: #303d40; --accent: #64d9e8;
      --accent-strong: #39c9dd; --accent-ink: #071719;
      --error: #ff8f89; --success: #75d8a0; --shadow: 0 28px 80px rgb(0 0 0 / 20%);
      font-family: "DM Sans", sans-serif;
    }
    :root[data-theme="light"] {
      color-scheme: light;
      --page: #ffffff; --panel: #ffffff; --panel-raised: #f4f8f8;
      --panel-soft: #f7fafa; --text: #162224; --text-soft: #506264;
      --muted: #738385; --line: #dce6e7; --accent: #007f91;
      --accent-strong: #00a8bc; --accent-ink: #ffffff;
      --error: #b43f3a; --success: #1d8150; --shadow: 0 24px 70px rgb(35 72 76 / 9%);
    }
    * { box-sizing: border-box; }
    body { min-height: 100vh; margin: 0; background: var(--page); color: var(--text); transition: background-color 180ms ease, color 180ms ease; }
    button, input, select { font: inherit; }
    button { color: inherit; cursor: pointer; }
    [hidden] { display: none !important; }
    
    .topbar { height: 76px; padding: 0 22px; display: flex; align-items: center; justify-content: space-between; border-bottom: 1px solid var(--line); }
    .brand { font: 800 19px "Manrope", sans-serif; color: var(--text); text-decoration: none; }
    .brand span { color: var(--accent); }
    
    .app-shell { width: min(1120px, calc(100% - 48px)); margin: 0 auto; padding-bottom: 40px; }
    .intro { padding: 40px 0 20px; }
    .intro h1 { font: 700 36px "Manrope", sans-serif; margin: 10px 0; }
    .intro h1 span { color: var(--accent); }
    
    .workspace { border: 1px solid var(--line); border-radius: 12px; background: var(--panel); box-shadow: var(--shadow); }
    .workspace-top { padding: 25px 30px; display: flex; justify-content: space-between; border-bottom: 1px solid var(--line); }
    .workspace-top h2 { margin: 0; font: 700 20px "Manrope", sans-serif; }
    
    #policyForm { padding: 30px; display: flex; flex-direction: column; gap: 20px; }
    .field { display: flex; flex-direction: column; gap: 8px; margin-bottom: 15px; }
    .field span { font-size: 12px; font-weight: 600; color: var(--text-soft); }
    .field input:not([type="checkbox"]):not([type="radio"]), .field select { width: 100%; height: 42px; padding: 0 12px; border: 1px solid var(--line); border-radius: 6px; background: var(--panel-soft); color: var(--text); }
    
    .check-list, .service-grid, .radio-list { display: grid; gap: 10px; margin-top: 10px; }
    .service-grid { grid-template-columns: 1fr 1fr; }
    .check-option, .service-option, .radio-option { padding: 12px; border: 1px solid var(--line); border-radius: 7px; background: var(--panel-soft); display: flex; align-items: center; gap: 10px; cursor: pointer; }
    .check-option:has(input:checked), .service-option:has(input:checked), .radio-option:has(input:checked) { border-color: var(--accent); background: color-mix(in srgb, var(--accent) 10%, var(--panel-soft)); }
    .check-copy strong, .service-name, .radio-option strong { font-size: 13px; font-weight: 600; }
    .check-copy small, .radio-option small { display: block; font-size: 11px; color: var(--muted); margin-top: 4px; }
    
    .form-footer { margin-top: 20px; padding-top: 20px; border-top: 1px solid var(--line); display: flex; justify-content: flex-end; }
    .button { padding: 0 20px; height: 40px; border-radius: 6px; font-weight: 700; border: none; transition: 0.2s; }
    .button-primary { background: var(--accent); color: var(--accent-ink); }
    .button-outline { border: 1px solid var(--line); background: transparent; color: var(--text); }
    .button-primary:hover { opacity: 0.9; }
    
    .result-view { padding: 30px; }
    .document-tabs { display: flex; gap: 20px; border-bottom: 1px solid var(--line); margin-bottom: 20px; }
    .document-tab { padding: 10px 0; background: none; border: none; color: var(--muted); font-weight: 700; font-size: 14px; border-bottom: 2px solid transparent; }
    .document-tab.is-selected { color: var(--accent); border-bottom-color: var(--accent); }
    .document-content { background: var(--panel-soft); padding: 20px; border-radius: 8px; max-height: 450px; overflow-y: auto; font-size: 14px; line-height: 1.7; }
    
    .result-actions { display: flex; gap: 10px; margin-top: 20px; flex-wrap: wrap; }
  </style>
</head>
<body>
  <header class="topbar">
    <a class="brand" href="#">Policy<span>Studio</span></a>
    <button class="button button-outline" id="themeToggle">Toggle Theme</button>
  </header>

  <main class="app-shell">
    <section class="intro">
      <h1>Professional <span>Legal Generator.</span></h1>
      <p style="color: var(--text-soft)">Generate detailed, store-compliant Privacy Policies & Terms with IronSource, AdMob, and Unity integrations.</p>
    </section>

    <!-- FORM SECTION -->
    <section class="workspace" id="wizardView">
      <div class="workspace-top"><h2>App Details & Ad Networks</h2></div>
      
      <form id="policyForm">
        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 15px;">
          <label class="field"><span>App / Game Name *</span><input id="appName" type="text" required></label>
          <label class="field"><span>Developer / Studio Name *</span><input id="developerName" type="text" required></label>
          <label class="field"><span>Contact Email *</span><input id="contactEmail" type="email" required></label>
          <label class="field"><span>App Model *</span>
            <select id="appType" required>
              <option value="Free">Free</option><option value="Freemium">Freemium</option><option value="Paid">Paid</option>
            </select>
          </label>
        </div>

        <h3 style="margin-top:20px; font-size: 16px;">What data do you access?</h3>
        <div class="check-list">
          <label class="check-option"><input type="checkbox" name="data" value="personal"><div class="check-copy"><strong>Personal Information</strong><small>Name, Email, Phone</small></div></label>
          <label class="check-option"><input type="checkbox" name="data" value="location"><div class="check-copy"><strong>Location Data</strong><small>Background or precise location</small></div></label>
          <label class="check-option"><input type="checkbox" name="data" value="camera"><div class="check-copy"><strong>Camera / Mic</strong><small>Audio/Video access</small></div></label>
          <label class="check-option"><input type="checkbox" name="data" value="device"><div class="check-copy"><strong>Device & Log Data</strong><small>IP address, crash logs, diagnostics</small></div></label>
        </div>

        <h3 style="margin-top:20px; font-size: 16px;">Third-Party Ad Networks & Services</h3>
        <div class="service-grid">
          <label class="service-option"><input type="checkbox" name="service" value="admob"><span class="service-name">Google AdMob</span></label>
          <label class="service-option"><input type="checkbox" name="service" value="unityAds"><span class="service-name">Unity Ads</span></label>
          <label class="service-option"><input type="checkbox" name="service" value="ironsource"><span class="service-name">IronSource (LevelPlay)</span></label>
          <label class="service-option"><input type="checkbox" name="service" value="firebaseAnalytics"><span class="service-name">Firebase Analytics</span></label>
          <label class="service-option"><input type="checkbox" name="service" value="googlePlay" checked><span class="service-name">Google Play Services</span></label>
        </div>

        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 15px; margin-top: 20px;">
          <div class="radio-list">
            <span style="font-size: 12px; font-weight:600; color:var(--text-soft)">Target Audience *</span>
            <label class="radio-option"><input type="radio" name="audience" value="13plus" checked><strong>For users 13+</strong></label>
            <label class="radio-option"><input type="radio" name="audience" value="under13"><strong>Includes children under 13</strong></label>
          </div>
          <label class="field"><span>Effective Date *</span><input id="effectiveDate" type="date" required></label>
        </div>

        <div class="form-footer">
          <button class="button button-primary" type="submit">Generate Detailed Policy</button>
        </div>
      </form>
    </section>

    <!-- RESULT SECTION -->
    <section class="workspace result-view" id="resultView" hidden>
      <h2>Your Detailed Legal Documents</h2>
      <div class="document-tabs">
        <button class="document-tab is-selected" id="privacyTab" data-doc="privacy">Privacy Policy</button>
        <button class="document-tab" id="termsTab" data-doc="terms">Terms & Conditions</button>
      </div>
      
      <div class="document-content" id="documentContent"></div>
      
      <div class="result-actions">
        <button class="button button-primary" id="downloadHtmlButton">⬇ Download HTML File</button>
        <button class="button button-outline" id="copyTextButton">Copy Text</button>
        <button class="button button-outline" id="startOverButton">Start Over</button>
      </div>
      <p id="actionStatus" style="color: var(--success); font-size: 12px; margin-top: 10px;"></p>
    </section>
  </main>

  <script>
    const themeToggle = document.querySelector("#themeToggle");
    themeToggle.addEventListener("click", () => {
      const isDark = document.documentElement.dataset.theme !== "light";
      document.documentElement.dataset.theme = isDark ? "light" : "dark";
    });

    const form = document.querySelector("#policyForm");
    const wizardView = document.querySelector("#wizardView");
    const resultView = document.querySelector("#resultView");
    const documentContent = document.querySelector("#documentContent");
    const statusMsg = document.querySelector("#actionStatus");
    
    let generatedDocs = { privacy: "", terms: "", appName: "" };
    let currentDoc = "privacy";

    form.addEventListener("submit", (e) => {
      e.preventDefault();
      
      const appName = document.querySelector("#appName").value;
      const devName = document.querySelector("#developerName").value;
      const email = document.querySelector("#contactEmail").value;
      const date = document.querySelector("#effectiveDate").value || new Date().toLocaleDateString();
      const appType = document.querySelector("#appType").value;
      const audience = document.querySelector('input[name="audience"]:checked').value;
      
      const services = [...document.querySelectorAll('input[name="service"]:checked')].map(el => el.parentElement.innerText);
      const dataCollected = [...document.querySelectorAll('input[name="data"]:checked')].map(el => el.parentElement.innerText);

      // Detailed Professional Privacy Policy
      let privacyHTML = `
        <h1>Privacy Policy for ${appName}</h1>
        <p><strong>Effective Date:</strong> ${date}</p>
        
        <h2>1. Introduction</h2>
        <p>${devName} ("we," "our," or "us") operates the ${appName} mobile application as a ${appType} service. This Privacy Policy informs you of our policies regarding the collection, use, and disclosure of personal data when you use our application and the choices you have associated with that data.</p>
        <p>We use your data to provide and improve the service. By using the application, you agree to the collection and use of information in accordance with this policy.</p>

        <h2>2. Information Collection and Use</h2>
        <p>While using our application, we may ask you to provide us with certain personally identifiable information that can be used to contact or identify you. The types of data collected include:</p>
        <ul>
          ${dataCollected.length > 0 ? dataCollected.map(d => `<li>${d}</li>`).join('') : '<li>No direct personal information is collected by us.</li>'}
        </ul>

        <h2>3. Third-Party Ad Networks & Services</h2>
        <p>Our application integrates third-party service providers and ad networks to display advertisements, analyze traffic, and ensure app stability. These third parties may collect information via device identifiers and cookies:</p>
        <ul>
          ${services.length > 0 ? services.map(s => `<li>${s}</li>`).join('') : '<li>Standard operating system services.</li>'}
        </ul>
        <p>These ad networks (such as Google AdMob, Unity Ads, and IronSource) may use information about your visits to this and other apps in order to provide relevant advertisements about goods and services of interest to you.</p>

        <h2>4. Security of Data</h2>
        <p>The security of your data is important to us, but remember that no method of transmission over the Internet, or method of electronic storage is 100% secure. While we strive to use commercially acceptable means to protect your Personal Data, we cannot guarantee its absolute security.</p>

        <h2>5. Children's Privacy</h2>
        <p>${audience === "under13" ? "This application includes features tailored for children under 13. We comply with COPPA regulations and do not knowingly collect personal information from children without proper parental consent." : "Our Service does not address anyone under the age of 13. We do not knowingly collect personally identifiable information from children under 13."}</p>

        <h2>6. Changes to This Privacy Policy</h2>
        <p>We may update our Privacy Policy from time to time. We will notify you of any changes by posting the new Privacy Policy on this page. You are advised to review this Privacy Policy periodically for any changes.</p>

        <h2>7. Contact Us</h2>
        <p>If you have any questions about this Privacy Policy, please contact us by email: <strong>${email}</strong></p>
      `;

      // Detailed Professional Terms & Conditions
      let termsHTML = `
        <h1>Terms & Conditions for ${appName}</h1>
        <p><strong>Effective Date:</strong> ${date}</p>

        <h2>1. Agreement to Terms</h2>
        <p>By downloading or using the ${appName} application, these terms will automatically apply to you. You should make sure therefore that you read them carefully before using the app.</p>

        <h2>2. Intellectual Property Rights</h2>
        <p>You are not allowed to copy, or modify the app, any part of the app, or our trademarks in any way. You are not allowed to attempt to extract the source code of the app, and you also shouldn't try to translate the app into other languages, or make derivative versions.</p>

        <h2>3. Advertisements & In-App Purchases</h2>
        <p>The app is supported by advertising revenues and may display ads and promotions. These advertisements may be targeted based on the information stored in your device or interaction with the app. Any virtual items or purchases made are governed by the respective app store's billing terms (Google Play Store / App Store).</p>

        <h2>4. Limitation of Liability</h2>
        <p>${devName} will not be held responsible if the app does not work at full functionality due to lack of data connectivity, device storage limitations, or operating system incompatibilities.</p>

        <h2>5. Governing Law</h2>
        <p>These terms shall be governed and construed in accordance with local laws, without regard to its conflict of law provisions.</p>

        <h2>6. Contact Information</h2>
        <p>If you have any queries regarding these Terms, please reach out at <strong>${email}</strong></p>
      `;

      generatedDocs = { privacy: privacyHTML, terms: termsHTML, appName: appName };
      
      wizardView.hidden = true;
      resultView.hidden = false;
      renderDoc("privacy");
    });

    function renderDoc(type) {
      currentDoc = type;
      documentContent.innerHTML = generatedDocs[type];
      document.querySelector("#privacyTab").classList.toggle("is-selected", type === "privacy");
      document.querySelector("#termsTab").classList.toggle("is-selected", type === "terms");
    }

    document.querySelectorAll(".document-tab").forEach(tab => {
      tab.addEventListener("click", (e) => renderDoc(e.target.dataset.doc));
    });

    document.querySelector("#startOverButton").addEventListener("click", () => {
      form.reset();
      resultView.hidden = true;
      wizardView.hidden = false;
      statusMsg.textContent = "";
    });

    document.querySelector("#copyTextButton").addEventListener("click", () => {
      const text = documentContent.innerText;
      navigator.clipboard.writeText(text).then(() => statusMsg.textContent = "Text Copied!");
    });

    document.querySelector("#downloadHtmlButton").addEventListener("click", () => {
      const fullHtml = `<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>${generatedDocs.appName} - ${currentDoc === 'privacy' ? 'Privacy Policy' : 'Terms & Conditions'}</title>
  <style>body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; line-height: 1.8; max-width: 800px; margin: 40px auto; padding: 20px; color: #222; }</style>
</head>
<body>
  ${generatedDocs[currentDoc]}
</body>
</html>`;
      
      const blob = new Blob([fullHtml], { type: "text/html" });
      const url = URL.createObjectURL(blob);
      const a = document.createElement("a");
      a.href = url;
      a.download = `${generatedDocs.appName.replace(/\s+/g, '_')}_${currentDoc}.html`;
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      URL.revokeObjectURL(url);
      
      statusMsg.textContent = "Detailed HTML File Downloaded Successfully!";
    });
  </script>
</body>
</html>
